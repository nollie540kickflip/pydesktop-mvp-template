[project]
name = "pydesktop-mvp-template"
version = "0.1.0"
description = "CustomTkinterとMVPパターンを用いたPythonデスクトップGUIアプリのテンプレート"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "customtkinter>=5.2.0",
]

[project.scripts]
pydesktop-mvp = "pydesktop_mvp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pydesktop_mvp"]
